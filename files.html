<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Auron Vault — Dateien</title>
<style>
:root{--bg:#06090c;--bg1:#0b1117;--bg2:#111a22;--line:#223140;--text:#eaf2f4;--muted:#6d8494;--accent:#5eead4;--danger:#ff5c72}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,rgba(94,234,212,.08),transparent 60%),var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:900px;margin:auto;padding:24px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-weight:750;font-size:18px}.brand b{color:var(--accent)}button,input{font:inherit}.btn{border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:11px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#04211c;border-color:var(--accent);font-weight:700}
h1{font-size:28px;margin:0 0 7px}.sub{color:var(--muted);line-height:1.5;margin:0 0 20px}.drop{border:1px dashed #38505f;border-radius:18px;padding:34px 18px;text-align:center;background:rgba(94,234,212,.025);cursor:pointer}.drop.drag{border-color:var(--accent);background:rgba(94,234,212,.07)}.drop strong{display:block;font-size:15px;margin-bottom:5px}.drop span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap}.search{flex:1;min-width:200px;background:var(--bg1);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px 13px;outline:none}.search:focus{border-color:var(--accent)}.meta{color:var(--muted);font-size:11px;margin:8px 0 12px}.list{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:12px;padding:13px;background:var(--bg1);border:1px solid var(--line);border-radius:15px}.icon{width:42px;height:42px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--accent);flex:none}.main{min-width:0;flex:1}.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px}.danger{color:var(--danger)}.empty{text-align:center;padding:45px 15px;border:1px solid var(--line);border-radius:18px;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}.status{margin-top:18px;font-size:11px;color:var(--muted);text-align:center}.error{padding:16px;border:1px solid rgba(255,92,114,.4);background:rgba(255,92,114,.07);border-radius:14px;color:#ffb1bc}
@media(max-width:600px){.app{padding:18px 13px 80px}.top{margin-bottom:18px}h1{font-size:24px}.row{align-items:flex-start}.actions{margin-left:auto}.actions .label{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Auron <b>Vault</b> · Dateien</div><button class="btn" id="back">← Vault</button></header>
<main>
<h1>Dateien</h1><p class="sub">Deine Dateien werden lokal in IndexedDB gespeichert und mit dem aktiven Vault-Schlüssel verschlüsselt.</p>
<div id="error"></div>
<input id="fileInput" type="file" multiple hidden>
<div class="drop" id="drop"><strong>↑ Dateien hinzufügen</strong><span>Klicken oder Dateien hierher ziehen · mehrere Dateien möglich</span></div>
<div class="toolbar"><input class="search" id="search" placeholder="Dateien durchsuchen …"><button class="btn" id="sort">Zuletzt geändert</button></div>
<div class="meta" id="meta">Lade Dateispeicher …</div>
<div class="list" id="list"></div>
<div class="status">Privat · lokal · verschlüsselt</div>
</main>
</div>
<script src="./files.js"></script>
</body>
</html>
