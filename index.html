  const row = el('div',{class:'btn-row', style:'margin-top:6px;'});
  const saveBtn = el('button',{class:'btn btn-primary'},[existing?'Speichern':'Hinzufügen']);
  saveBtn.addEventListener('click', async ()=>{
    if(!titleInput.value.trim() || !pwInput.value){ toast('Titel und Passwort erforderlich','danger'); return; }
    if(existing){
      existing.title = titleInput.value.trim();
      existing.username = userInput.value.trim();
      existing.url = urlInput.value.trim();
      existing.notes = notesInput.value.trim();
      existing.password = pwInput.value;
      existing.updatedAt = Date.now();
    } else {
      AV.state.session.entries.push({
        id: crypto.randomUUID(),
        title: titleInput.value.trim(),
        username: userInput.value.trim(),
        url: urlInput.value.trim(),
        notes: notesInput.value.trim(),
        password: pwInput.value,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
    }
    await persistVault();
    overlay.remove();
    goTo('dashboard');
    toast(existing?'Eintrag aktualisiert':'Eintrag gespeichert','ok');
  });
  row.appendChild(saveBtn);
  sheet.appendChild(row);

  if(existing){
    sheet.appendChild(el('button',{class:'btn btn-ghost', style:'color:var(--danger); margin-top:10px; align-self:center; display:flex; margin-left:auto; margin-right:auto;', onclick: async ()=>{
      AV.state.session.entries = AV.state.session.entries.filter(e=>e.id!==existing.id);
      await persistVault();
      overlay.remove();
      goTo('dashboard');
      toast('Eintrag gelöscht');
    }},[el('span',{html:svgIcon('trash',14)}),' Eintrag löschen']));
  }

  overlay.appendChild(sheet);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  setTimeout(()=>titleInput.focus(), 60);
}

function openEntryDetail(entryId){
  const entry = AV.state.session.entries.find(e=>e.id===entryId);
  if(!entry) return;
  const overlay = el('div',{class:'overlay'});
  const sheet = el('div',{class:'sheet'});

  sheet.appendChild(el('div',{style:'display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;'},[
    el('div',{style:'display:flex; align-items:center; gap:12px;'},[
      el('div',{class:'entry-avatar', style:`background:${colorForId(entry.id)};`},[initialsFor(entry.title)]),
      el('h3',{style:'font-size:17px;'},[entry.title]),
    ]),
    el('button',{class:'btn btn-icon btn-secondary', html:svgIcon('x',16), onclick:()=>overlay.remove()})
  ]));
  sheet.appendChild(el('div',{class:'divider'}));

  function detailRow(label, value, opts={}){
    const row = el('div',{class:'panel', style:'margin-bottom:10px;'});
    row.appendChild(el('div',{style:'font-size:11px; color:var(--text-2); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;'},[label]));
    const valRow = el('div',{style:'display:flex; align-items:center; justify-content:space-between; gap:10px;'});
    const valSpan = el('div',{class:'mono', style:'font-size:14.5px; word-break:break-all;'},[opts.masked ? '••••••••••••' : (value||'—')]);
    valRow.appendChild(valSpan);
    const btnGroup = el('div',{style:'display:flex; gap:4px; flex-shrink:0;'});
    if(opts.maskable){
      let masked = true;
      const eyeBtn = el('button',{class:'btn btn-icon btn-secondary', style:'width:32px;height:32px;', html:svgIcon('eye',15)});
      eyeBtn.addEventListener('click', ()=>{
        masked = !masked;
        valSpan.textContent = masked ? '••••••••••••' : value;
        eyeBtn.innerHTML = svgIcon(masked?'eye':'eyeOff',15);
      });
      btnGroup.appendChild(eyeBtn);
    }
    if(value){
      const copyBtn = el('button',{class:'btn btn-icon btn-secondary', style:'width:32px;height:32px;', html:svgIcon('copy',15)});
      copyBtn.addEventListener('click', ()=>copyToClipboard(value, label));
      btnGroup.appendChild(copyBtn);
    }
    valRow.appendChild(btnGroup);
    row.appendChild(valRow);
    return row;
  }

  sheet.appendChild(detailRow('Benutzername', entry.username));
  sheet.appendChild(detailRow('Passwort', entry.password, {maskable:true, masked:true}));
  if(entry.url) sheet.appendChild(detailRow('Website', entry.url));
  if(entry.notes) sheet.appendChild(detailRow('Notizen', entry.notes));

  const row = el('div',{class:'btn-row', style:'margin-top:8px;'});
  row.appendChild(el('button',{class:'btn btn-secondary', onclick:()=>{ overlay.remove(); openEntryEditor(entry.id); }},[el('span',{html:svgIcon('edit',15)}),' Bearbeiten']));
  sheet.appendChild(row);

  overlay.appendChild(sheet);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function openCredentialChange(){
  const overlay = el('div',{class:'overlay'});
  const sheet = el('div',{class:'sheet'});
  sheet.appendChild(el('div',{style:'display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;'},[

  ]));

  const cnInput = el('input',{type:'text', class:'input-mono', placeholder:'Neuer Codename', style:'text-transform:uppercase; text-align:center;'});

async function regenerateRecoveryCode(){

   NOTFALL: KONTO LÖSCHEN — vorher Passwörter rotieren, damit nichts wiederherstellbar bleibt
   ========================================================================= */
function openEmergencyDeleteFlow(){
  const overlay = el('div',{class:'overlay'});
  const sheet = el('div',{class:'sheet'});
  sheet.appendChild(el('div',{style:'width:52px;height:52px;border-radius:15px;background:var(--danger-dim);display:flex;align-items:center;justify-content:center;color:var(--danger);margin-bottom:16px;', html:svgIcon('alertTriangle',24)}));
  sheet.appendChild(el('h3',{style:'font-size:18px; margin-bottom:8px; color:var(--danger);'},['Konto & alle Daten löschen']));
  sheet.appendChild(el('p',{style:'font-size:13.5px; color:var(--text-1); line-height:1.6; margin-bottom:14px;'},[
    `Es werden zuerst alle ${AV.state.session.entries.length} gespeicherten Passwörter automatisch durch zufällige, unbrauchbare Werte überschrieben. Danach werden Tresor, Master-Passwort, Codename, PIN und Recovery-Code endgültig aus dem lokalen Speicher entfernt.`
  ]));
  sheet.appendChild(el('div',{class:'alert alert-danger', style:'margin-bottom:18px;'},[
    el('div',{html:svgIcon('alertTriangle',16)}),
    el('div',{},['Dies ist unumkehrbar. Niemand — auch nicht du selbst — kann die Daten danach wiederherstellen.'])
  ]));

  const input = el('input',{type:'text', placeholder:'LÖSCHEN eingeben zum Bestätigen', class:'input-mono'});
  sheet.appendChild(el('div',{class:'field'},[el('label',{},['Zum Bestätigen „LÖSCHEN“ eingeben']), input]));

  const btn = el('button',{class:'btn btn-danger'},['Passwörter überschreiben & Konto löschen']);
  btn.disabled = true;
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().toUpperCase() !== 'LÖSCHEN'; });
  btn.addEventListener('click', async ()=>{
    btn.disabled = true; btn.textContent = 'Überschreibe Passwörter …';
    // Schritt 1: jedes gespeicherte Passwort mit kryptografisch zufälligem Wert überschreiben (mehrfach)
    for(let pass=0; pass<3; pass++){
      AV.state.session.entries = AV.state.session.entries.map(e=>({
        ...e, password: AV.gen.entryPassword(32), username: '', url: '', notes: '', title: 'GELÖSCHT'
      }));
    }
    try{ await persistVault(); }catch(e){}
    await new Promise(r=>setTimeout(r, 400));
    btn.textContent = 'Lösche Konto …';
    await new Promise(r=>setTimeout(r, 350));
    // Schritt 2: kompletten lokalen Speicher entfernen
    AV.store.wipeAll();
    AV.state.session = { unlocked:false, vaultKey:null, entries:[], notes:[], failedAttempts:0, recoveryLockActive:false };
    overlay.remove();
    goTo('welcome');
    toast('Konto vollständig gelöscht');
  });
  sheet.appendChild(btn);
  sheet.appendChild(el('button',{class:'btn btn-ghost', style:'margin-top:10px; align-self:center; display:flex; margin-left:auto; margin-right:auto;', onclick:()=>overlay.remove()},['Abbrechen']));

  overlay.appendChild(sheet);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  document.body.appendChild(overlay);
}
